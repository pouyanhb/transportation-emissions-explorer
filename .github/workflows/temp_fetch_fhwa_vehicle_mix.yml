name: Temporary FHWA vehicle-mix data fetch

on:
  push:
    paths:
      - ".github/workflows/temp_fetch_fhwa_vehicle_mix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download official FHWA/DOT CSV files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fhwa_vehicle_mix
          curl -fL --retry 3 "https://data.transportation.gov/api/v3/views/wafx-xpmf/export.csv?accessType=DOWNLOAD" -o fhwa_vehicle_mix/fhwa_vm4_2009_2024.csv
          curl -fL --retry 3 "https://data.transportation.gov/api/v3/views/nps9-3pm2/export.csv?accessType=DOWNLOAD" -o fhwa_vehicle_mix/fhwa_vm2_1980_2024.csv
          test -s fhwa_vehicle_mix/fhwa_vm4_2009_2024.csv
          test -s fhwa_vehicle_mix/fhwa_vm2_1980_2024.csv
          echo "VM-4 bytes: $(wc -c < fhwa_vehicle_mix/fhwa_vm4_2009_2024.csv)"
          echo "VM-2 bytes: $(wc -c < fhwa_vehicle_mix/fhwa_vm2_1980_2024.csv)"
          head -n 2 fhwa_vehicle_mix/fhwa_vm4_2009_2024.csv
          head -n 2 fhwa_vehicle_mix/fhwa_vm2_1980_2024.csv

      - name: Upload source CSVs
        uses: actions/upload-artifact@v4
        with:
          name: fhwa-vehicle-mix-source-data
          path: fhwa_vehicle_mix/
          retention-days: 1
