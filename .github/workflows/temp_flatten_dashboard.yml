name: Temporary flatten dashboard bundle

on:
  push:
    paths:
      - ".github/workflows/temp_flatten_dashboard.yml"

permissions:
  contents: write

jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace loader with self-contained dashboard
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc data/site-full.gz > index.html
          test -s index.html
          grep -q "Transportation Emissions" index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No change needed"
          else
            git commit -m "Serve dashboard directly without runtime bundle fetch"
            git push
          fi
